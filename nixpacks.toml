# Nixpacks configuration pour Dokploy
# Laravel + Inertia Vue SSR + PHP 8.4 + PostgreSQL

[phases.setup]
# Installation de PHP 8.4 avec toutes les extensions nécessaires
nixPkgs = [
    "php84",
    "php84Extensions.gd",
    "php84Extensions.pdo",
    "php84Extensions.pdo_pgsql",
    "php84Extensions.mbstring",
    "php84Extensions.xml",
    "php84Extensions.bcmath",
    "php84Extensions.curl",
    "php84Extensions.zip",
    "php84Extensions.intl",
    "php84Extensions.opcache",
    "php84Extensions.exif",
    "php84Extensions.fileinfo",
    "php84Extensions.tokenizer",
    "php84Extensions.dom",
    "php84Extensions.pcntl",
    "php84Extensions.posix",
    "nodejs_20",
    "yarn",
    "nginx"
]

[phases.install]
# Installation des dépendances
dependsOn = ["setup"]
cmds = [
    "composer install --optimize-autoloader --no-dev --no-interaction --prefer-dist",
    "yarn install --frozen-lockfile --production=false"
]

[phases.build]
# Build et préparation de l'application
dependsOn = ["install"]
cmds = [
    # Build des assets frontend (CSS et JS avec SSR)
    "yarn build",
    
    # Optimisations Laravel pour la production
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache",
    
    # Publier les assets des vendors
    "php artisan vendor:publish --tag=laravel-assets --force",
    
    # Créer le lien symbolique storage
    "php artisan storage:link --force",
    
    # Optimiser l'autoloader Composer
    "composer dump-autoload --optimize",
    
    # Nettoyer les dépendances Node non nécessaires en production
    "rm -rf node_modules",
    "yarn install --frozen-lockfile --production=true"
]

[phases.runtime]
# Configuration Nginx pour servir l'application
dependsOn = ["build"]
cmds = [
    '''
    cat > /etc/nginx/sites-available/default << 'EOF'
    server {
        listen 8080;
        server_name _;
        root /app/public;
        
        index index.php;
        
        charset utf-8;
        
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
        
        error_page 404 /index.php;
        
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }
        
        location ~ /\.(?!well-known).* {
            deny all;
        }
        
        client_max_body_size 100M;
    }
    EOF
    ''',
    "ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default"
]

[start]
# Script de démarrage avec PHP-FPM et Nginx
cmd = '''
#!/bin/bash
set -e

# Exécuter les migrations au démarrage
php artisan migrate --force

# Démarrer les workers de queue si nécessaire
# php artisan queue:work --daemon &

# Démarrer PHP-FPM
php-fpm8.4 -D

# Démarrer Nginx au premier plan
nginx -g 'daemon off;'
'''

[variables]
# Port fixe pour Dokploy/Traefik
PORT = "8080"

# Les autres variables seront gérées dans Dokploy directement